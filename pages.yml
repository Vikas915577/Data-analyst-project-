name: Deploy portfolio site to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'reports/**'
      - 'excel/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static portfolio site
        run: |
          mkdir -p site/reports site/downloads
          cp index.html site/index.html
          cp reports/demo_analysis.html site/reports/demo_analysis.html
          cp reports/dashboard_preview.png site/reports/dashboard_preview.png
          cp excel/Credit_Risk_Analytics.xlsx site/downloads/Credit_Risk_Analytics.xlsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
