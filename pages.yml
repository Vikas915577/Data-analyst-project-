name: Publish static portfolio preview
on:
  push:
    branches: [main, master]
    paths:
      - 'reports/demo_analysis.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static report site
        run: |
          mkdir -p site
          cp reports/demo_analysis.html site/index.html
          cp reports/dashboard_preview.png site/dashboard_preview.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
